name: Deploy to Public Pages Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MESTO_PAGES_DEPLOY_KEY: ${{ secrets.MESTO_PAGES_DEPLOY_KEY }}
      VITE_MESTO_COHORT: ${{ secrets.VITE_MESTO_COHORT }}
      VITE_MESTO_TOKEN: ${{ secrets.VITE_MESTO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
            node-version: '>=22.12'
            cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Explain deployment setup
        if: env.MESTO_PAGES_DEPLOY_KEY == '' || env.VITE_MESTO_COHORT == '' || env.VITE_MESTO_TOKEN == ''
        run: echo "Build checked. Configure MESTO_PAGES_DEPLOY_KEY, VITE_MESTO_COHORT and VITE_MESTO_TOKEN secrets to enable publication."

      - name: Deploy to GitHub Pages
        if: env.MESTO_PAGES_DEPLOY_KEY != '' && env.VITE_MESTO_COHORT != '' && env.VITE_MESTO_TOKEN != ''
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.MESTO_PAGES_DEPLOY_KEY }}
          external_repository: ${{ secrets.PUBLIC_PAGES_REPO || 'shimoro3212/mesto-production' }}
          publish_dir: ./dist
          publish_branch: ${{ secrets.PUBLIC_PAGES_BRANCH || 'main' }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: update build'
