<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesto</title>

gn-items:center;justify-content:space-between;padding:16px 20px;gap:12px}.card__caption h2{margin:0;font-size:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card__likes{display:grid;text-align:center;font-size:13px}.card__like{padding:0;background:transparent;border:0;color:#000;font-size:27px;line-height:1}footer{padding:65px 0 50px;color:#a9a9a9}dialog{width:min(430px,calc(100% - 56px));max-height:calc(100dvh - 56px);overflow:visible;border:0;border-radius:10px;padding:34px 36px}dialog::backdrop{background:#000b}dialog h2{margin:0 0 24px;font-size:24px}.close{width:30px;height:30px;position:absolute;top:-31px;right:-31px;background:transparent;border:0}.close:before,.close:after{content:"";position:absolute;height:2px;width:28px;background:#fff;top:14px;left:1px;transform:rotate(45deg)}.close:after{transform:rotate(-45deg)}form{display:grid;gap:16px}label{display:grid;gap:5px;font-size:14px}input{width:100%;padding:8px 0;border:0;border-bottom:1px solid #aaa}input[aria-invalid=true]{border-color:#c00}.error,.form-status{color:#a00;font-size:13px;margin:0}.submit{min-height:48px;border-radius:2px;border:1px solid #000;background:#000;color:#fff}.submit:disabled{color:#555;background:#fff}.preview{background:transparent;color:#fff;padding:0;width:fit-content;max-width:75vw}.preview figure{margin:0}.preview img{display:block;max-width:100%;max-height:75vh}.preview figcaption{padding-top:8px;font-size:13px}.popup_type_info h3{margin:18px 0 8px;font-size:16px}.info-list{margin:0}.info-list div{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:6px}.info-list dd{margin:0}.info-list dt,.info-users li{background:#ececec;border-radius:3px;padding:3px 6px}.info-users{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0;max-height:26vh;overflow:auto}.info-empty{margin:0}@media(min-width:601px)and (max-width:820px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.header{padding:26px 0 28px}.l </head>
<body>
<header class="header"><span class="logo">Mesto<sup>Russia</sup></span></header>
<main>
  <section class="profile" aria-label="Профиль">
    <button class="avatar" data-open="avatar" aria-label="Обновить аватар" disabled><img alt=""><span aria-hidden="true">✎</span></button>
    <div class="profile__text">
      <div class="profile__heading"><h1>Мой профиль</h1><button class="edit" data-open="profile" aria-label="Редактировать профиль" disabled>✎</button></div>
      <p class="profile__about"></p>
    </div>
    <button class="add" data-open="add" aria-label="Добавить карточку" disabled>＋</button>
  </section>
  <section class="connection" hidden aria-labelledby="connection-title">
    <h2 id="connection-title">Подключение к Практикуму</h2>
    <p>Введите ID учебной группы и токен Mesto. После обновления страницы их нужно будет ввести снова.</p>
    <form class="connection__form" autocomplete="off">
      <label>ID группы<input name="cohort" required placeholder="apf-cohort-123" spellcheck="false"></label>
      <label>Токен Mesto<input name="token" type="password" required autocomplete="off"></label>
      <button class="submit" type="submit">Подключить</button>
    </form>
  </section>
  <p class="status" role="status"></p>
  <section class="cards" aria-label="Карточки"></section>
</main>
<footer>© Mesto Russia</footer>

<dialog id="profile" aria-labelledby="profile-title">
  <button class="close" type="button" aria-label="Закрыть"></button>
  <h2 id="profile-title">Редактировать профиль</h2>
  <form novalidate>
    <label>Имя<input name="name" required minlength="2" maxlength="40" pattern="[А-Яа-яЁёA-Za-z \-]+"><span class="error"></span></label>
    <label>О себе<input name="about" required minlength="2" maxlength="200" pattern="[А-Яа-яЁёA-Za-z \-]+"><span class="error"></span></label>
    <button class="submit" disabled>Сохранить</button>
  </form>
</dialog>
<dialog id="avatar" aria-labelledby="avatar-title">
  <button class="close" type="button" aria-label="Закрыть"></button>
  <h2 id="avatar-title">Обновить аватар</h2>
  <form novalidate>
    <label>Ссылка на изображение<input name="avatar" type="url" required pattern="https?://.+"><span class="error"></span></label>
    <button class="submit" disabled>Сохранить</button>
  </form>
</dialog>
<dialog id="add" aria-labelledby="add-title">
  <button class="close" type="button" aria-label="Закрыть"></button>
  <h2 id="add-title">Новое место</h2>
  <form novalidate>
    <label>Название<input name="name" required minlength="2" maxlength="30" pattern="[А-Яа-яЁёA-Za-z \-]+"><span class="error"></span></label>
    <label>Ссылка на картинку<input name="link" type="url" required pattern="https?://.+"><span class="error"></span></label>
    <button class="submit" disabled>Создать</button>
  </form>
</dialog>
<dialog id="preview" class="preview" aria-label="Просмотр фотографии">
  <button class="close" type="button" aria-label="Закрыть"></button>
  <figure><img alt=""><figcaption></figcaption></figure>
</dialog>
<dialog id="info" class="popup_type_info" aria-labelledby="info-title">
  <button class="close" type="button" aria-label="Закрыть"></button>
  <h2 id="info-title">Информация о карточке</h2>
  <dl class="info-list"></dl>
  <h3>Лайкнули</h3>
  <ul class="info-users"></ul>
  <p class="info-empty" hidden>Пока никто</p>
</dialog>

<template id="card-template">
  <article class="card">
    <button class="card__photo" type="button"><img alt=""></button>
    <button class="card__control-button card__control-button_type_info" type="button" aria-label="Информация о карточке">ⓘ</button>
    <button class="card__control-button card__delete" type="button" aria-label="Удалить карточку">×</button>
    <div class="card__caption">
      <h2></h2>
      <div class="card__likes"><button class="card__like" type="button" aria-label="Нравится" aria-pressed="false">♡</button><span class="card__like-count"></span></div>
    </div>
  </article>
</template>
<template id="popup-info-definition-template">
  <div><dt></dt><dd></dd></div>
</template>
<template id="popup-info-user-preview-template">
  <li><span></span></li>
</template>
